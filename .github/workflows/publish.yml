name: publish

# PyPI releases are cut MANUALLY, never on a push to main.
#
# To release:
#   1. Bump `version` in pyproject.toml (in a commit to main).
#   2. Actions tab -> "publish" -> "Run workflow".
#
# The job publishes only if that version isn't already on PyPI, so re-running
# without a version bump is a safe no-op (it fails fast with a clear message).
# pyproject.toml's `version` is the single source of truth. Publishing uses
# PyPI Trusted Publishing (no tokens).

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: |
          uv run pytest tests/ \
            --ignore=tests/test_agreement.py \
            --ignore=tests/test_corrdiff.py \
            --ignore=tests/test_corrdiff_integration.py \
            -m "not gpu and not integration" -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Refuse to republish an existing version
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          echo "pyproject.toml version: $VERSION"
          if curl -sf "https://pypi.org/pypi/accord-deepscale/$VERSION/json" > /dev/null; then
            echo "::error::accord-deepscale $VERSION is already on PyPI — bump 'version' in pyproject.toml first."
            exit 1
          fi
          echo "$VERSION is new on PyPI; proceeding to publish."
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
